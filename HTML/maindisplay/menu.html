<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/maindisplay.css">
        <title>utktanteiroku_sample</title>
    </head>

    <!--形式上別のhtmlとなっていますが、meindisplayのhtmlにメインメニューが
    　　重ねて表示される形式でお願いします。-->

    <body>
        <div id="maindisplaybase" class="base">
            <div class="contentdiv top">
                <button id="backdisplaybutton" class="backbutton">戻る</button><!--ゲーム画面に戻るボタン-->

                <!--class="top"のdisplayがnoneになっていて、
                素の状態では表示されませんので表示させる場合にはdisplayを変更してください-->

                <!--機能追加予定-->
                <div id="menublock">
                    <button id="setting" class="menubotton">
                        設定
                    </button>
                    <button id="backtotitle" class="menubotton">
                        タイトルに戻る
                    </button>
                </div>
            </div><!--タイトル画面の上に表示する用のdiv-->
            <div id="alertdiv" class="top"></div><!--確認画面用のdiv-->
        </div>
    </body>
</html>
