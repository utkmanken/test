<!DOCTYPE html>
<html>
    <!-- スペースの数はそちらに合わせます。 -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/title.css">
        <title>utktanteiroku_title</title>
    </head>
    <body>
        <div class="base" id="titlebase">     
            <div id="contentdiv" class="top"></div><!--タイトル画面の上に表示する用のdiv-->
            <div id="alertdiv" class="top"></div><!--確認画面用のdiv-->
            <div id="titlebg"></div> <!--タイトル画面の背景-->
            <div id="mainlogotype">
                <div id="pendant" src="../../material/other_materials/pendant.svg"></div>
                <div id="logo_base"></div>
                <div id="titlelogo" class="flash"></div>
            </div><!--タイトル画面のタイトルロゴ-->   

            <div id="largebuttonblock"><!--大きいボタンの整列用-->
                <button id="ini_storybuttonL" class="title_largebutton hidden">
                    はじめからスタート
                </button>
                <button id="seq_storybutton" class="title_largebutton">
                    続きからスタート
                </button>
                <button id="endingbutton" class="title_largebutton hidden">
                    エンディングを見る
                </button>
                <button id="solvingbutton" class="title_largebutton">
                    謎解きモード
                </button>
            </div>
            <div id="smallbuttonblock"><!--小さいボタンの整列用-->
                <button id="methodbutton" class="title_smallbutton">
                    操作方法
                </button>
                <button id="recordbutton" class="title_smallbutton">
                    あらすじ/振り返り
                </button>
                <button id="ini_storybuttonS" class="title_smallbutton">
                    はじめから
                </button>
            </div>
            <div id="tooliconblock"><!--画面下部のアイコン-->
                <button id="cameraicon" class="toolicon">
                    
                </button>
                <button id="codeicon" class="toolicon">
                    
                </button>
                <button id="settingicon" class="toolicon">

                </button>
            </div>
        </div>
        
    </body>
</html>
